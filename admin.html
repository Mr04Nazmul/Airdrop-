<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAZU Admin</title><script src="config.js"></script><style>body{margin:0;background:#080b10;color:#eef2f7;font-family:system-ui;padding:28px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222b37;padding-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card{background:#10151d;border:1px solid #26303d;border-radius:15px;padding:18px}.num{font-size:28px;font-weight:800;margin-top:8px}table{width:100%;border-collapse:collapse;background:#10151d;border:1px solid #26303d}th,td{padding:12px;text-align:left;border-bottom:1px solid #202936}th{color:#8f9aaa;font-size:12px;text-transform:uppercase}button{background:#7c5cff;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700}p{color:#8f9aaa}.err{color:#ff7185}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px;display:block;overflow:auto}}</style></head><body><div class="wrap"><div class="top"><h1>NAZU Admin</h1><button id="login">Sign in with admin wallet</button></div><p id="msg">Admin access is wallet-signature protected. The admin wallet must be configured server-side.</p><div class="grid"><div class="card">Users<div class="num" id="users">—</div></div><div class="card">Active nodes<div class="num" id="nodes">—</div></div><div class="card">Total points<div class="num" id="points">—</div></div><div class="card">Eligibility<div class="num">Server</div></div></div><table><thead><tr><th>Wallet</th><th>Points</th><th>Heartbeats</th><th>Uptime</th><th>Node</th><th>Eligible</th></tr></thead><tbody id="rows"><tr><td colspan="6">Sign in to load production data.</td></tr></tbody></table></div><script>const C=window.NAZU_CONFIG||{};const $=x=>document.getElementById(x);const base=C.EDGE_FUNCTION_BASE;async function call(name,b){const r=await fetch(base+'/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':C.SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+C.SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function msg(x,err=false){$('msg').textContent=x;$('msg').className=err?'err':''}async function login(){if(!window.ethereum){msg('MetaMask required.',true);return}try{const [w]=await ethereum.request({method:'eth_requestAccounts'});const nonce=crypto.randomUUID();const issued=Date.now();const message='NAZU Admin dashboard login\n\nWallet: '+w+'\nNonce: '+nonce+'\nIssued: '+issued+'\nPurpose: Read admin dashboard data.';const sig=await ethereum.request({method:'personal_sign',params:[message,w]});const d=await call('admin-stats',{wallet_address:w,message,signature:sig});$('users').textContent=d.users;$('nodes').textContent=d.active_nodes;$('points').textContent=Number(d.total_points).toLocaleString();$('rows').innerHTML=d.rows.map(u=>'<tr><td>'+u.wallet_address.slice(0,8)+'…'+u.wallet_address.slice(-6)+'</td><td>'+Number(u.points).toLocaleString()+'</td><td>'+u.total_heartbeats+'</td><td>'+Math.floor(u.uptime_seconds/60)+'m</td><td>'+u.node_status+'</td><td>'+u.eligible+'</td></tr>').join('')||'<tr><td colspan="6">No users.</td></tr>';msg('Authenticated. Data loaded.')}catch(e){msg(e.message,true)}}$('login').onclick=login;</script></body></html>
